#CI项目
name: 构建和发布固件Release WRT
run-name: Release - ${{ inputs.model }}
on:
  schedule:
    # 每 3 天编译一次（UTC 时间，北京时间 = UTC+8）
    # UTC 20:00 = 北京时间 04:00
    - cron: '0 20 */3 * *'
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: jdcloud_ipq60xx_immwrt
        options:
          - aliyun_ap8220_immwrt
          - aliyun_ap8220_libwrt
          - cmcc_rax3000m_immwrt
          - gemtek_w1701k_immwrt
          - jdcloud_ax6000_immwrt
          - jdcloud_ipq60xx_immwrt
          - jdcloud_ipq60xx_libwrt
          - sy_y6010_immwrt
          - sy_y6010_libwrt
          - link_nn6000v2_immwrt
          - link_nn6000v2_libwrt
          - linksys_mx4x00_immwrt
          - n1_immwrt
          - qihoo_360v6_immwrt
          - redmi_ax5_immwrt
          - redmi_ax6_immwrt
          - redmi_ax6_libwrt
          - redmi_ax6000_immwrt21
          - zn_m2_immwrt
          - zn_m2_libwrt
          - x64_immwrt
#CI权限
permissions:
  contents: write
  actions: write
#CI任务
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check Server Performance(检查服务器性能)
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT
      # 前置磁盘扩容清理
      - name: Free Disk Space(清理磁盘空间)
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rm"
          rmz_version: "3.1.1"
          testing: false
      # 完整编译依赖补充
      - name: Build System Setup(安装依赖环境)
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev golang-go ca-certificates
          sudo -E update-ca-certificates
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Set Build Date and Timezone
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          export BUILD_SRC=$(awk -F"=" '/REPO_URL/ {print $NF}' "./wrt_core/compilecfg/${{ inputs.model }}.ini")
          echo "BUILD_SRC=$BUILD_SRC" >> $GITHUB_ENV
      - name: Pre Clone
        run: |
          for script in $(find . -name "*.sh"); do
            chmod +x "$script"
          done
          ./wrt_core/pre_clone_action.sh ${{ inputs.model }}
      #==================== Fix mosdns ====================
      - name: Fix luci-app-mosdns dependency
        run: |
          cd ./action_build
          rm -rf package/luci-app-mosdns feeds/packages/net/v2ray-geodata package/mosdns
          git clone https://github.com/sbwml/luci-app-mosdns -b v5 package/mosdns
          git clone https://github.com/sbwml/v2ray-geodata package/v2ray-geodata
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd -
      # Xray ghproxy镜像替换
      - name: Replace Xray-core Git Source Mirror
        run: |
          find ./ -path "*package/xray-core/Makefile" -type f -exec sed -i 's|https://github.com/XTLS/Xray-core.git|https://mirror.ghproxy.com/https://github.com/XTLS/Xray-core.git|g' {} \; || true
      # 修改ini：删除kmod‑iptables、bmx7包，保留kmod‑nf‑ipt(NSS‑ECM)
      - name: Remove kmod‑iptables & bmx7 from INI
        run: |
          INI_FILE="./wrt_core/compilecfg/${{ inputs.model }}.ini"
          echo "INI_FILE: ${INI_FILE}"
          [ ! -f "${INI_FILE}" ] && echo "ERROR: ini not found" && exit 1
          sed -i '/kmod-iptables/d' "${INI_FILE}"
          sed -i '/bmx7/d' "${INI_FILE}"
          echo "==== Check ini after modify ===="
          grep -E "kmod-iptables|kmod-nf-ipt|bmx7" "${INI_FILE}" || echo "kmod‑iptables & bmx7 removed"
      # 清空旧编译缓存
      - name: Clean Old Build Cache Before Config Gen
        run: |
          rm -rf ./action_build/build_dir ./action_build/dl ./action_build/tmp ./action_build/staging_dir || true
      # .config强制关闭kmod‑iptables
      - name: Force disable kmod‑iptables (keep kmod‑nf‑ipt for NSS‑ECM)
        run: |
          cd ./action_build
          make defconfig
          sed -i 's/CONFIG_PACKAGE_kmod-iptables=y/# CONFIG_PACKAGE_kmod-iptables is not set/g' .config
          make defconfig
          echo "==== Verify config ===="
          grep -E "CONFIG_PACKAGE_kmod-iptables|CONFIG_PACKAGE_kmod-nf-ipt" .config
          grep -r "kmod-iptables" --include="Makefile" package/ feeds/ || true
          cd -
      # 缓存
      - name: Cache Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ./action_build/.ccache
          key: ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}-
      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;
      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi
      - name: Machine Information (Pre‑build)
        run: |
          echo "=============== Pre‑build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket"
          free -h
          df -hT
      # --------------------------
      # 关键：临时修改build.sh的make并发，编译完自动恢复，不改动仓库源文件
      # --------------------------
      - name: Patch build.sh reduce make concurrency (no commit change)
        run: |
          cp -af ./build.sh ./build.sh.bak
          # 将脚本里所有 make -jN / make -j$(nproc) 替换为 make -j2 -l2
          sed -E -i 's/make\s+-j[0-9]+/make -j2 -l2/g' ./build.sh
          sed -E -i 's/make\s+-j\$\(nproc\)/make -j2 -l2/g' ./build.sh
          echo "=== build.sh patched preview ==="
          grep "make -j" ./build.sh || echo "no -j found in build.sh"
      # 编译固件，超时360分钟，V=sc详细日志
      - name: Build Firmware(编译固件)
        timeout-minutes: 360
        run: export BUILD_VERBOSE="V=sc" && ./build.sh ${{ inputs.model }}
      # 恢复原始build.sh备份
      - name: Restore original build.sh
        if: always()
        run: |
          [ -f ./build.sh.bak ] && mv -f ./build.sh.bak ./build.sh
      - name: Get Kernel Verion
        run: |
          echo "KVER=$(grep -oP "^kernel.*" ./firmware/*.manifest | grep -oP "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}")" >> $GITHUB_ENV
      - name: Delete Old Cache
        run: |
          gh cache list --key ${{ matrix.os }}-${{ hashFiles('**/repo_flag') }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          echo "ccache size: $(du -sh ./action_build/.ccache | cut -f 1)"
      - name: Machine Information (Post‑build)
        run: |
          echo "=============== Post‑build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Uptime: $(uptime -p)"
          free -h
          df -hT
          echo "Firmware count: $(ls -1 ./firmware 2>/dev/null | wc -l)"
      - name: Package OpenWrt Firmware(打包固件)
        if: ${{ inputs.model == 'n1_immwrt' }}
        uses: unifreq/openwrt_packit@8007d3efd49bb42aa20c5755a50af21dc7a438e1
        env:
          OPENWRT_ARMVIRT: firmware/*.tar.gz
          PACKAGE_SOC: s905d
          KERNEL_VERSION_NAME: 6.6.y
          WHOAMI: YooY
      - name: Prepare Release Body
        run: |
          echo "云编译发布" > release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "WIFI密码: 12345678" >> release_body.txt
          echo "LAN地址: 192.168.1.1" >> release_body.txt
          echo "插件：" >> release_body.txt
          grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest | awk -F":" '{print $NF}' >> release_body.txt
      - name: Release Firmware(发布固件)
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ inputs.model }}
          files: ${{ inputs.model == 'n1_immwrt' && env.PACKAGED_OUTPUTPATH || './firmware' }}/*.*
          body_path: ./release_body.txt
      - name: Post‑clean Disk Space
        if: always()
        run: |
          rm -rf ./action_build/build_dir ./action_build/dl 2>/dev/null || true
          sudo apt-get clean -y 2>/dev/null || true
          df -hT
