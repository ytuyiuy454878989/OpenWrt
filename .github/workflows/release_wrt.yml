#CI项目
name: 构建和发布固件Release WRT
run-name: Release - ${{ inputs.model }}
on:
  schedule:
# 每 3 天编译一次（UTC 时间，北京时间 = UTC+8）
# UTC 20:00 = 北京时间 04:00
    - cron: '0 20 */3 * *'#→ Runs at 20:00, every 3 days
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: jdcloud_ipq60xx_immwrt
        options:
          - aliyun_ap8220_immwrt
          - aliyun_ap8220_libwrt
          - cmcc_rax3000m_immwrt
          - gemtek_w1701k_immwrt
          - jdcloud_ax6000_immwrt
          - jdcloud_ipq60xx_immwrt
          - jdcloud_ipq60xx_libwrt
          - sy_y6010_immwrt
          - sy_y6010_libwrt
          - link_nn6000v2_immwrt
          - link_nn6000v2_libwrt
          - linksys_mx4x00_immwrt
          - n1_immwrt
          - qihoo_360v6_immwrt
          - redmi_ax5_immwrt
          - redmi_ax6_immwrt
          - redmi_ax6_libwrt
          - redmi_ax6000_immwrt21
          - zn_m2_immwrt
          - zn_m2_libwrt
          - x64_immwrt
permissions:
  contents: write
  actions: write

env:
  BUILD_FOLDER: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 当前构建仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: builder

      - name: 设置脚本执行权限（修复git丢失可执行位）
        run: |
          cd builder
          chmod +x pre_clone_action.sh
          chmod +x apply_patches.sh
          chmod +x modules/system.sh
          ls -l *.sh modules/*.sh

      - name: 【阶段1】源码克隆前预处理 pre_clone_action
        run: |
          cd builder
          ./pre_clone_action.sh
        shell: bash

      - name: 导出环境变量至后续步骤
        run: |
          cd builder
          echo "BASE_PATH=$(pwd)" >> $GITHUB_ENV
          echo "BUILD_DIR=$(pwd)/${{ env.BUILD_FOLDER }}" >> $GITHUB_ENV
          echo "MODEL=${{ github.event.inputs.model }}" >> $GITHUB_ENV
        shell: bash

      - name: 安装编译依赖包
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison git libssl-dev gawk gettext unzip file libncurses-dev zlib1g-dev libelf-dev python3 python3-pip curl wget ca-certificates rsync time
        shell: bash

      - name: 缓存ccache（加速编译）
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/.ccache
          key: ${{ github.workflow }}-${{ github.job }}-ccache-${{ github.sha }}-${{ env.MODEL }}
          restore-keys: |
            ${{ github.workflow }}-${{ github.job }}-ccache-${{ env.MODEL }}-

      - name: 【阶段2】Clone上游源码
        run: |
          set -o errexit
          cd ${{ env.BASE_PATH }}
          # 可修改此处仓库与分支
          git clone --depth 1 --branch openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git ${{ env.BUILD_FOLDER }}
          cd ${{ env.BUILD_FOLDER }}
          git log -1 --oneline
        shell: bash

      - name: 复制patches、customfeeds到源码目录
        run: |
          set -o errexit
          cd ${{ env.BASE_PATH }}
          [ -d patches ] && cp -r patches ${{ env.BUILD_FOLDER }}/
          [ -d customfeeds ] && cp -r customfeeds ${{ env.BUILD_FOLDER }}/
          ls -la ${{ env.BUILD_FOLDER }}/
        shell: bash

      - name: 添加自定义feeds链接到feeds.conf.default
        run: |
          set -o errexit
          cd ${{ env.BUILD_DIR }}
          echo "src-link customfeeds $(realpath ${{ env.BASE_PATH }}/customfeeds)" >> feeds.conf.default
          cat feeds.conf.default
        shell: bash

      - name: 更新与安装feeds
        run: |
          set -o errexit
          cd ${{ env.BUILD_DIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        shell: bash

      - name: 【阶段3】执行全部system.sh补丁 apply_patches.sh
        run: |
          set -o errexit
          cd ${{ env.BASE_PATH }}
          ./apply_patches.sh
        shell: bash

      - name: 加载对应机型配置文件，如 configs/${{ env.MODEL }}
        run: |
          cd ${{ env.BASE_PATH }}
          if [ -f "configs/${{ env.MODEL }}" ];then
            echo "✅ 使用机型配置: ${{ env.MODEL }}"
            cp configs/${{ env.MODEL }} ${{ env.BUILD_DIR }}/.config
          else
            echo "⚠️ 未找到configs/${{ env.MODEL }}，将使用默认defconfig"
          fi
        shell: bash

      - name: make defconfig 生成配置
        run: |
          set -o errexit
          cd ${{ env.BUILD_DIR }}
          make defconfig
        shell: bash

      - name: 打印关键配置预览
        run: |
          cd ${{ env.BUILD_DIR }}
          grep -E "^CONFIG_TARGET|^CONFIG_PACKAGE_luci|^CONFIG_PACKAGE_kernel" .config | head -150
        shell: bash

      - name: 下载源码包 make download
        run: |
          set -o errexit
          cd ${{ env.BUILD_DIR }}
          make download -j$(nproc)
        shell: bash

      - name: 编译固件 make
        run: |
          cd ${{ env.BUILD_DIR }}
          make -j$(nproc) V=s
        shell: bash

      - name: 上传固件制品
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.MODEL }}-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/bin/targets/*/*/*.bin
            ${{ env.BUILD_DIR }}/bin/targets/*/*/*.img
            ${{ env.BUILD_DIR }}/bin/targets/*/*/*.manifest
          retention-days: 14
